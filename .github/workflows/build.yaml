on:
  push:
    branches:
      - ros2
jobs:
  build:
    runs-on: ubuntu-latest      
    steps:
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - uses: ros-tooling/action-ros-ci@v0.3
        with:
          package-name: tagslam
          target-ros2-distro: humble
          vcs-repo-file-url: https://raw.githubusercontent.com/Sid220/tagslam/refs/heads/ros2/tagslam.repos
